name: Telegram bildirimi

on:
  schedule:
    # UTC saatiyle yazilir. 06:00 UTC = 09:00 Turkiye saati, her gun.
    - cron: "0 6 * * *"
  workflow_dispatch: # Actions sekmesinden "Run workflow" ile elle calistirmak icin

jobs:
  gonder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mesaji gonder
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: "6847519503"
        run: python send.py
